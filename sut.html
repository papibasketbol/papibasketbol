<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şut Geliştirme Programı | PapiBasketball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="papi.css">
    <style>
        .program-container {
            max-width: 600px;
            width: 90%;
            margin: 20px auto;
            text-align: center;
        }

        .shot-card {
            background: linear-gradient(145deg, #1e1e1e, #121212);
            border: 2px solid #ff8c00;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.2);
            margin-bottom: 30px;
        }

        .shot-card h1 {
            color: #ff8c00;
            font-size: 32px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge {
            background: #ff8c00;
            color: black;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .features {
            text-align: left;
            margin: 25px 0;
        }

        .feature-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .feature-item:hover {
            background: rgba(255, 140, 0, 0.1);
            transform: translateX(10px);
        }

        .feature-item i {
            color: #ff8c00;
            font-size: 20px;
            margin-right: 15px;
        }

        .buy-btn {
            background: #25D366;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="program-container">
        <div class="shot-card">
            <span class="badge">SHARP SHOOTER</span>
            <h1>ŞUT GELİŞTİRME</h1>
            <p>Menzilini genişlet, her mesafeden tehdit ol!</p>

            <div class="features">
                <div class="feature-item">
                    <i class="fas fa-bullseye"></i>
                    <span>Şut Formu & Mekanik Düzeltme</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-bolt"></i>
                    <span>Hızlı Release (Topu Elden Hızlı Çıkarma)</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-sync-alt"></i>
                    <span>Catch & Shoot İstikrarı</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-arrows-alt"></i>
                    <span>Dribbling Üzeri Şut Yaratma</span>
                </div>
            </div>

            <a href="https://wa.me/905323363348" class="buy-btn" target="_blank">
                <i class="fab fa-whatsapp" style="font-size: 24px; margin-right: 10px;"></i> 
                KESKİN NİŞANCI OL
            </a>
        </div>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
        </a>
    </div>

</body>
</html>
